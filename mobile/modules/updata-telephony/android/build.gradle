plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.updatatelephony'
version = '0.1.0'

android {
  namespace "expo.modules.updatatelephony"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    // Pure helpers are tested on the JVM; android.* stubs return defaults instead of throwing.
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
