name: CI

# Runs on every push and every pull request. Nothing here touches the server —
# it only says whether the code is sound. Deployment stays a deliberate act.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A second push to the same branch cancels the first: the older answer is
  # about code nobody is looking at any more.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # A handful of suites boot the whole Express application and call it over
    # HTTP. Those need the services the app connects to at startup — without
    # Redis they do not fail, they hang, and the job dies on a 60-second
    # timeout with nothing useful in the log.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mongo:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")' --quiet"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # The suites that need a database start their own in-memory MongoDB.
      # Caching the binary keeps every run from downloading 55 MB — and a
      # corrupt download once failed two tests for a week on a checksum.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-6.0.16

      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # The schema refuses to boot without these; the values are never used
          # by a test, they only have to satisfy the length checks.
          JWT_SECRET: ci-secret-that-is-long-enough-for-the-schema
          SESSION_SECRET: ci-session-secret-value
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          REDIS_URL: redis://127.0.0.1:6379

  client:
    name: Client — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  mobile:
    name: Mobile — tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:build-config
      - run: npm test -- --ci --runInBand --watchman=false
